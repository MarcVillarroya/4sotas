supuestos:
  - "Los umbrales (LTV 80/90 %, DTI 35/40 %, estrés 40/45 %, colchón de 6/3 cuotas) son práctica de mercado, no una norma legal."
  - "Los gastos de compra se estiman como porcentaje editable del precio; varían por comunidad y tipo de vivienda y no son una tasa única."
  - "El ahorro cubre entrada, gastos y colchón: el efectivo restante es ahorro menos entrada menos gastos estimados."
  - "La prueba de estrés suma dos puntos al TIN y recalcula la cuota con el mismo plazo; no simula una revisión real del tipo."
limites:
  - "El veredicto es un encaje aritmético orientativo con tus datos; cada entidad decide y ninguna aprobación está garantizada."
  - "No estima la probabilidad de que un banco conceda la hipoteca: no hay modelo ni datos para eso."
  - "No incluye seguros, comisiones de mantenimiento ni vinculaciones, ni la fiscalidad personal de la compra."
  - "No modela hipotecas variables ni Euríbor; el TIN introducido se mantiene fijo en toda la simulación."
tests: tests/finanzas-viabilidad.ts
temas:
  - tema-vivienda
  - tema-banca
