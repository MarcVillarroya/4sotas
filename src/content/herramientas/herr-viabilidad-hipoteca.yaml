fuentes:
  - fuente: src-s7-04
    dato: La financiación habitual es de hasta el 80 % del valor de tasación como práctica bancaria, no como límite legal.
  - fuente: src-bde-consulta-endeudamiento-40
    dato: El Banco de España indica que el total de deudas no debería superar el 40 % de los ingresos netos mensuales.
  - fuente: src-s7-05
    dato: Escala de ITP en Cataluña desde el 27 de junio de 2025; 10 % hasta 600.000 € y tipo medio por encima, verificado en la ATC.
  - fuente: src-s7-06
    dato: IVA del 10 % en obra nueva y 4 % en vivienda de protección oficial de régimen especial; la segunda mano tributa por ITP autonómico.
seo:
  descripcion: "Calcula si una compra encaja con tu ahorro e ingresos: hipoteca necesaria, LTV, cuota, DTI, prueba con +2 puntos y efectivo restante."
actualizacion:
  politica: revision-anual
slug: viabilidad-hipoteca
titulo: ¿Puedo comprar esta casa?
descripcion: "Comprueba si una compra encaja con tu ahorro y tus ingresos: hipoteca necesaria, LTV, cuota, DTI, prueba con dos puntos más y efectivo restante."
tipo: calculadora
estado_implementacion: beta
version_motor: 1.0.0
formula: >-
  gastos = precio·gastos%/100; hipoteca = precio − entrada; LTV = hipoteca/precio; cuota por sistema francés con el TIN
  introducido; cuota de estrés con TIN + 2 puntos; efectivo = ahorro − entrada − gastos; DTI = (cuota + otras deudas)/ingresos;
  ingresos mínimos = (cuota + otras deudas)/0,35.
unidad_salida: EUR-por-mes
