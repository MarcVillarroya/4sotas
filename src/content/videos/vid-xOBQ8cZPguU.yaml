informacion:
  estado: completo
  resumen: "Una nómina de 1.500 € no es dinero disponible: 1.100 € ya están
    comprometidos en vivienda, facturas, comida y transporte, y 100 € se apartan
    para ahorrar. Quedan 300 €, que entre 30 días son 10 € diarios de media. Si
    el primer día gastas 80 €, quedan 220 € para 29 días: 7,59 € al día. El
    saldo de la cuenta no es el presupuesto que puedes gastar."
  que_cubre:
    - Por qué 1.500 € de nómina dejan solo 300 € disponibles tras compromisos y
      ahorro.
    - Cómo se pasa de 300 € en 30 días a 10 €/día y a 7,59 €/día tras una compra
      de 80 €.
    - "La diferencia entre saldo y presupuesto: lo que hay en la cuenta no es lo
      que puedes gastar."
  que_no_cubre:
    - "No es asesoramiento financiero: el reparto 1.100/100/300 es un ejemplo,
      no una regla universal."
    - No promete que apartar 100 € sea posible en cualquier nómina de 1.500 € ni
      tiene en cuenta gastos imprevistos.
  para_quien: Para quien cobra una nómina fija, quiere saber cuánto puede gastar
    de verdad cada día y se lleva sustos a mitad de mes.
