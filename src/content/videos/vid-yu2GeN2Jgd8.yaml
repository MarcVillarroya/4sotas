  resumen: "Un descuento del 27 % sobre 150 € deja el precio en 110 €, pero si hace 20 días el mismo producto costaba 100 €, la rebaja esconde 10 € de sobrecoste. En el Black Friday de 2025, OCU analizó más de 14.000 precios de 60 tiendas online: el 35 % bajó, el 37 % subió y el 28 % quedó igual. La ley exige además tomar como referencia el precio más bajo de los 30 días anteriores."
  que_cubre:
    - Por qué un 27 % de descuento puede esconder un pago de 10 € más que hace 20 días.
    - "Qué dicen los datos de OCU del Black Friday 2025: 35 % bajó, 37 % subió y 28 % quedó igual."
    - "La regla legal de los 30 días y las tres comprobaciones antes de comprar: historial, precio final y necesidad."
  que_no_cubre:
    - "No señala a ninguna empresa ni producto real: los 100 €, 150 € y 110 € son un ejemplo ficticio."
    - No es asesoramiento de consumo ni financiero, ni promete que todas las ofertas sean falsas.
