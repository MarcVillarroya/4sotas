  estado: completo
  resumen: "Un piso de 200.000 € con hipoteca del 80 % parece cuestión de 40.000 €: el banco pone 160.000 y tú el resto. El vídeo enseña la segunda barrera, los impuestos: con el ITP general del 10 % sobre vivienda usada, la base suma 20.000 € más y la entrada real se va a 60.000 €, antes de gastos y tasación."
  que_cubre:
    - "Por qué la entrada de un piso de 200.000 € no son 40.000 €: el ITP general del 10 % añade 20.000 €."
    - "Los gastos que quedan fuera de la cuenta: compraventa y tasación."
    - "Los matices del supuesto: vivienda usada, sin bonificaciones, hipoteca del 80 % hipotética y tipos reducidos según comunidad y edad."
  que_no_cubre:
    - "No es asesoramiento financiero ni una regla general de precios e impuestos."
    - "No entra en la aprobación de la hipoteca según ingresos: eso queda para otra pieza del canal."
  para_quien: "Para quien tiene ahorrado lo que cree que es la entrada de un piso y quiere ver la cuenta completa antes de mirar casas."
