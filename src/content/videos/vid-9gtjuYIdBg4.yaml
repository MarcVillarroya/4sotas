  resumen: "El reto del céntimo consiste en apartar 1 céntimo el día 1, 2 el día 2 y uno más cada jornada hasta el 365. La suma es 667,95 €, pero el esfuerzo no es plano: los primeros 30 días solo reúnen 4,65 € y los últimos 30 exigen 105,15 €, más de 22 veces lo mismo. La alternativa es preparar las 365 cantidades y tacharlas en el orden que convenga, sin cambiar el total."
  que_cubre:
    - "Cómo funciona el reto: 1 céntimo más cada día y 667,95 € al terminar el año."
    - Por qué los últimos 30 días concentran 105,15 € frente a los 4,65 € de los primeros.
    - La alternativa de las 365 cantidades tachadas para quien el orden diario no le encaje.
  que_no_cubre:
    - "No es asesoramiento financiero ni promete que el dinero salga de la nada: sale del presupuesto."
    - No tiene en cuenta la inflación, los intereses ni la rentabilidad de ese dinero parado.
  para_quien: Para quien quiere empezar a ahorrar con una regla simple y entender por qué el último mes es el que rompe el reto.
