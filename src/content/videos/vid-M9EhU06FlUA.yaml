  resumen: "Abre una nómina de ejemplo de 2026 línea a línea, desde cero y sin jerga: 24.000 € brutos al año en 12 pagas son 2.000 € al mes, de los que se restan 130 € de cotizaciones (6,50 %) y 270,20 € de retención de IRPF (13,51 %), hasta un neto de 1.599,80 €. Los 400,20 € de diferencia tienen explicación y el vídeo cierra con cinco comprobaciones para revisar tu propia nómina."
