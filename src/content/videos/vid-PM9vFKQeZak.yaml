informacion:
  estado: completo
  resumen: "En la subasta del 3 de noviembre de 2026, las Letras a doce meses se
    colocaron al 3,045 % de media. Diez Letras de 1.000 € cuestan 9.701,40 € y
    devuelven 10.000 € al vencer: 298,60 € brutos. Tras el 19 % de IRPF quedan
    241,87 €, y el Tesoro no retiene nada: se declara en la Renta. Si la
    inflación ronda el 2,5 %, hacen falta 242,54 € para no perder poder
    adquisitivo."
  que_cubre:
    - "Qué cuesta de verdad una Letra de 1.000 €: 970,14 € en la subasta y 1.000
      € al vencimiento, con un 3,045 % de media."
    - La diferencia entre el bruto (298,60 €) y el neto tras el 19 % de IRPF
      (241,87 €).
    - Por qué la retención practicada es del 0 % y el impuesto se paga en la
      declaración de la Renta.
    - "El efecto de una inflación del 2,5 %: 242,54 € para mantener el poder de
      compra, es decir, ganancia real ≈ 0."
  que_no_cubre:
    - "No es asesoramiento ni una recomendación: la inflación del 2,5 % es una
      hipótesis del ejemplo, no una previsión."
    - No compara con otros plazos, cuentas remuneradas o fondos, ni incluye
      comisiones de compra.
