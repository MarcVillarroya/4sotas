  resumen: "Un café, un delivery, una app que se renueva sola: parece calderilla hasta que se suma. El vídeo distingue los gastos hormiga (pequeños y frecuentes) de los fantasma (cargos que se renuevan solos) y suma un ejemplo hipotético: 10 cafés al mes a 2,50 € son 300 € al año, 6 pedidos con recargos 360 € y una suscripción olvidada 80 €, en total 740 €. Propone revisar los últimos tres meses."
