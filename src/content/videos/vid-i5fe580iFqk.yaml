  resumen: "10.000 € quietos en la cuenta siguen siendo 10.000 €, pero compran menos. Con la inflación de España en el 4,9 % (IPC, avance de septiembre de 2026), el vídeo calcula que ese dinero pierde unos 467 € de poder de compra y equivale a unos 9.533 € de un año antes, y muestra la operación: 10.000 ÷ 1,049. Explica también qué significa ese 4,9 % con una cesta que pasa de 100 € a 104,90 €."
