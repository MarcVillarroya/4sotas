informacion:
  estado: completo
  resumen: "Un piso de 250.000 € exige unos 75.000 € antes de firmar. Con 2.000 € netos y 500 € de ahorro al mes, la entrada lleva 12,5 años. La hipoteca de 200.000 € a 30 años y 3,5 % se queda en 898,09 € al mes, el 44,9 % de la nómina, por encima del 40 % recomendado. El precio sube un 12,2 % y el salario medio no sigue: no es falta de esfuerzo, es la relación entre salarios, vivienda y crédito."
  que_cubre:
    - Por qué un piso de 250.000 € necesita unos 75.000 € de entrada y gastos, y cuánto tarda alguien que ahorra 500 € al mes.
    - "La hipoteca de 200.000 € a 30 años y 3,5 %: 898,09 € al mes, el 44,9 % de una nómina de 2.000 €."
    - Qué dicen el IPV, el salario medio y la emancipación juvenil sobre la brecha entre precios y sueldos.
  que_no_cubre:
    - No es asesoramiento financiero ni una predicción de precios; la simulación usa supuestos fijos de tipo, plazo y ahorro.
    - No compara todas las ciudades ni recoge ayudas, avales o tipos autonómicos caso por caso.
  para_quien: Para quien trabaja, ahorra y siente que comprar casa se aleja; para separar qué parte es esfuerzo personal y qué parte es el mercado.
