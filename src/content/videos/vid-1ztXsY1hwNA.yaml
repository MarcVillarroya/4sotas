  resumen: "¿Cobras 1.600 € y a mitad de mes ya no sabes cuánto te queda? El vídeo plantea que el problema no es cuánto ganas, sino que todo el dinero vive en la misma cuenta, y explica el sistema de tres cuentas: recibos y gastos fijos, día a día y ahorro, con un reparto de ejemplo de 1.600 € en 950, 500 y 150 €. Las cantidades son un ejemplo del mecanismo."
  que_cubre:
    - Por qué el sueldo se acaba antes de fin de mes cuando todo el dinero está en una sola cuenta
    - "El reparto de ejemplo: 950 € de recibos fijos, 500 € de día a día y 150 € de ahorro sobre 1.600 €"
    - Que el ahorro se aparta primero, antes de gastar, y no con lo que sobra
  que_no_cubre:
    - "No es un reparto personalizado: las cantidades son un ejemplo para explicar el mecanismo."
