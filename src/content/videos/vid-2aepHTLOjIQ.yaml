informacion:
  estado: completo
  resumen: "Una pareja cobra 2.800 € y 1.600 € y comparte 1.800 € de gastos. Si paga a medias, ambos ponen 900 €, pero uno destina el 32,1 % de su sueldo y el otro el 56,3 %. El vídeo repasa las tres formas de organizar el dinero —todo en común, cuentas separadas y sistema mixto— y muestra el reparto proporcional: 1.145 € y 655 €, el 40,9 % para ambos. No hay un único reparto justo; la clave es el acuerdo."
  que_cubre:
    - "Por qué 900 € no cuestan lo mismo a quien cobra 2.800 € que a quien cobra 1.600 €: 32,1 % frente a 56,3 %."
    - "Las tres formas de organizar el dinero: todo en común, cuentas separadas y sistema mixto con cuenta compartida."
    - "El reparto proporcional: 1.145 € y 655 € para que ambos destinen el 40,9 % de su sueldo."
    - La diferencia entre el tipo de cuenta y el criterio para repartir los gastos.
  que_no_cubre:
    - "No es asesoramiento financiero ni fiscal: las cifras son un ejemplo hipotético, no medias del mercado."
    - No entra en régimen legal de gananciales, titularidad de cuentas ni consecuencias fiscales.
  para_quien: Para parejas que comparten gastos y quieren decidir con cifras si juntan todo, separan las cuentas o usan un sistema mixto.
