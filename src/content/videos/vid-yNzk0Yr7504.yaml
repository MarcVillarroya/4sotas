informacion:
  estado: completo
  resumen: "Dos hogares con los mismos 2.000 € netos pueden pertenecer a clases estadísticas distintas. El documental recorre la renta equivalente y los límites de la OCDE, la diferencia entre salario medio y mediano, el gasto real de los hogares, el ahorro, la riqueza y la evolución de la clase media entre 2007 y 2022. La conclusión: no se está desplomando demográficamente, pero pertenecer a ella ya no garantiza estabilidad."
  que_cubre:
    - "Por qué 2.000 € netos no significan lo mismo en un hogar de una persona que en uno de cuatro: renta equivalente y escala OCDE."
    - La diferencia entre salario medio y mediano, y por qué la media engaña.
    - "Qué pasa con el dinero después de cobrarlo: gasto, ahorro y patrimonio."
    - "La clase media no desaparece: pasa del 59,2 % en 2007 al 61,1 % en 2022, pero la estabilidad se estrecha."
  que_no_cubre:
    - No es asesoramiento financiero ni una predicción económica.
    - "No trata la vivienda como mercado: solo como componente de gasto y patrimonio."
  para_quien: Para quien cobra una nómina normal y quiere entender por qué la sensación de no avanzar no es solo suya.
