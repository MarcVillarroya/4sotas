  resumen: "Subir de tramo de IRPF no te hace ganar menos. Con un ejemplo de 23.500 € brutos que pasan a 24.500 €, el vídeo desglosa qué ocurre con esa subida: 253 € van al IRPF y 65 € a la Seguridad Social, así que quedan 682 €. El mecanismo son escalones: cada parte del sueldo paga el porcentaje de su tramo, no todo al tipo más alto. Fuente: Agencia Tributaria, IRPF 2026."
