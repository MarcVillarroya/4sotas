  estado: completo
  resumen: "Te suben el sueldo un 3 %: pasas de 2.000 € a 2.060 € netos. Con el IPC interanual en el 4,9 %, mantener tu nivel de vida costaría 2.098 €, así que te faltan 38 € al mes. Aunque cobras 60 € más, tu poder adquisitivo cae alrededor de un 1,8 %. El vídeo separa la subida nominal del coste real y recuerda que el 4,9 % es el dato de avance del INE de octubre de 2026."
  que_cubre:
    - "La diferencia entre subida nominal y poder adquisitivo: 2.000 € → 2.060 € frente a una cesta de 2.098 €."
    - De dónde salen los 38 € que faltan y por qué equivalen a una pérdida real del 1,8 %.
    - Cómo comparar una subida salarial con el IPC y por qué el dato de avance del INE importa.
  que_no_cubre:
    - "No es asesoramiento financiero ni una predicción de inflación: usa un ejemplo hipotético."
    - No entra en salarios por sector, convenios, IRPF ni en la subida del bruto.
  para_quien: Para quien ha recibido una subida y quiere entender por qué el recibo no siempre se traduce en más capacidad de compra.
