  resumen: "Con 1.000 € disponibles, ¿amortizas deuda o inviertes? El vídeo plantea que no hay respuesta automática: depende de lo que cuesta la deuda y de lo que podrías ganar. Pone dos cifras de ejemplo: una tarjeta al 18 % costaría unos 180 € en intereses por mantener 1.000 € un año, e invertir al 7 % daría unos 70 € sin garantía. La regla: deuda cara, primero amortizar; deuda barata, primero calcular."
