  resumen: "En septiembre de 2008 Lehman Brothers se declaró en quiebra y parecía
    un problema de Wall Street, lejos de España; años después superó los seis
    millones de parados. El documental sigue el hilo: el crédito barato y las
    hipotecas subprime, la burbuja inmobiliaria española, los rescates y la
    factura final, hasta lo que dejó enseñado. Con datos de la Reserva Federal,
    el INE, el Banco de España, el FROB, Sareb y el MEDE."
