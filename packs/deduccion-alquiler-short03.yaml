titulo: "¿Pagas 800 € de alquiler? Podrías deducirte 960 €"
slug: deduccion-alquiler-short03

descripcion_corta: "La nueva deducción estatal por alquiler es del 10 %, pero depende de tu base imponible: con el mismo alquiler de 800 € al mes puedes deducirte 960 € o solo unos 350 €."

seo_descripcion: "Deducción por alquiler 2026: 10 % del alquiler con límites según tu base imponible. Con 800 €/mes, de 960 € a 350 € según tu caso."

resumen_editorial: "Dos personas pagan 800 € de alquiler al mes. Una tiene una base imponible de 23.000 € y puede deducirse 960 €; la otra llega a 30.000 € y su deducción baja a 349,74 €, unos 350 €. La nueva deducción estatal del 10 % solo se aplica por debajo de 33.007,20 € de base imponible, y su base máxima se reduce 1,163 € por cada euro que supera los 23.007,20 €. No es dinero que Hacienda ingrese: reduce el IRPF."

que_cubre:
  - "Por qué dos personas con el mismo alquiler deducen 960 € y 350 €: la base imponible decide la base máxima de la deducción."
  - "Cómo se calcula el 10 % del alquiler anual y por qué 9.600 € se convierten en 960 € solo en el tramo sin reducción."
  - "Los requisitos que no salen en el titular: vivienda habitual, otra vivienda a menos de 50 km y cuota estatal suficiente."

que_no_cubre:
  - "No es una ayuda ni un ingreso: es una deducción que reduce la cuota del IRPF y depende de cada declaración."
  - "No cubre deducciones autonómicas ni casos con alquiler parcial, varias personas o bases distintas a las del ejemplo."

para_quien: "Para quien paga alquiler y ha visto titulares sobre los 960 €: sirve para entender de qué depende la cifra antes de darla por segura."

