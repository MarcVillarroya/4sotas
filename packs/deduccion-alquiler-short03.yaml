  - "Cálculos propios: 800 × 12 = 9.600 €; 9.600 × 10 % = 960 €; base máxima a 30.000 € = 11.630 − 1,163 × 6.992,80 = 3.497,37 €; × 10 % = 349,74 €."

disclaimer: "Contenido educativo; no es asesoramiento fiscal. Simulación con doce mensualidades completas, una persona contribuyente y cuota estatal suficiente. Comprueba tu caso concreto."

