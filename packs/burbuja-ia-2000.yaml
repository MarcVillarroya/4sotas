titulo: "¿Burbuja de la IA? Los datos que recuerdan a 2000"
slug: burbuja-ia-2000

descripcion_corta: "Internet cambió el mundo y el Nasdaq cayó un 77 %. Veintiséis años después, 720.000 millones al año en IA: ¿oportunidad histórica o pago de más por el futuro?"

seo_descripcion: "El Nasdaq cayó un 77 % tras las puntocom. Hoy las tecnológicas invierten 720.000 millones en IA. Qué dicen los datos y qué no."

resumen_editorial: "Internet cambió el mundo y el Nasdaq cayó un 77,4 % entre 2000 y 2002. 26 años después, las tecnológicas prevén invertir 720.000–740.000 millones en un año para liderar la IA. El documental sigue el dinero —capex, centros de datos, ingresos, flujo de caja y financiación— y compara las valoraciones de 1999 con las de 2026. La pregunta no es si la IA cambiará la economía, sino cuánto futuro descuenta su precio."

que_cubre:
  - "La comparación entre la burbuja puntocom y el ciclo de inversión en IA: qué se parece y qué no."
  - "El destino del dinero: 720.000–740.000 millones de capex anual, centros de datos, chips y energía."
  - "La demanda real: crecimiento de Azure, Google Cloud y AWS, y el flujo de caja libre de las grandes tecnológicas."
  - "Quién financia la expansión y qué tres escenarios podrían darse entre 2027 y 2030."

que_no_cubre:
  - "No es una predicción ni una recomendación de inversión: los escenarios son hipotéticos y sin probabilidades."
  - "No entra en fiscalidad, selección de valores concretos ni en el momento de entrada o salida."

para_quien: "Para quien invierte en tecnología o fondos indexados y quiere entender si el gasto en IA está creando valor o solo expectativas."

