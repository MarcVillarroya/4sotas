titulo: "Comprar un piso de 250.000 €: las cuentas completas"
slug: comprar-piso-250k

descripcion_corta: "Pieza larga de 12 minutos: de una cuota de 843 € al mes a necesitar 78.000 € ahorrados, con impuestos, tasación, intereses y las ayudas que cambian la cuenta."

seo_descripcion: "Cuenta completa de comprar un piso de 250.000 €: 78.000 € de fondos propios, el giro de la tasación, 843,21 € de cuota y 103.555 € de intereses."

resumen_editorial: "Un piso de 250.000 € parece asumible con una cuota de 843 € al mes, pero para firmar hacen falta unos 78.000 €: 50.000 de entrada, 25.000 de ITP en Cataluña y 3.000 de provisión. Añade el giro de la tasación (230.000 € recortan el préstamo a 184.000 y suben el ahorro a 94.000), separa gastos de compraventa y de hipoteca según la Ley 5/2019 y cierra con el coste: 103.555 € de intereses y 381.554,90 € nominales."

que_cubre:
  - "De la cuota de 843 € al ahorro real: 50.000 € de entrada, 25.000 € de impuestos y 3.000 € de provisión"
  - "El giro de la tasación: 230.000 € recortan el préstamo a 184.000 € y suben los fondos propios a 94.000 €"
  - "Qué asume el banco y qué pagas tú al constituir la hipoteca, según la Ley 5/2019"
  - "El coste a largo plazo: 103.555 € de intereses y 381.554,90 € nominales en 30 años"

que_no_cubre:
  - "No es asesoramiento financiero ni fiscal: las cifras son un escenario con supuestos concretos (Cataluña, ITP del 10 %, 3 % fijo)."
  - "No entra en financiación por encima del 80 %, ayudas autonómicas al margen del ITP reducido del 5 % ni fiscalidad de otras comunidades."

para_quien: "Para quien está mirando su primer piso y quiere ver todas las cifras antes de firmar, no solo la cuota."

