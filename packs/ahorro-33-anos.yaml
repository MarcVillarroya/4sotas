descripcion_corta: "Con 150 € al mes desde los 30, reunir la entrada de un piso de 200.000 € lleva 33 años y 4 meses. La cuenta, paso a paso."

seo_descripcion: "Por qué 150 € al mes no bastan para la entrada de un piso: 60.000 € iniciales, 400 meses y 33 años y 4 meses. Cifras y matices."

resumen_editorial: "Con 30 años y 150 € al mes, reunir la entrada de un piso de 200.000 € lleva 33 años y 4 meses. El vídeo desglosa los 60.000 € iniciales —40.000 de aportación y 20.000 de ITP general sobre vivienda usada—, explica los 400 meses y muestra el envejecimiento. Cierra con los matices: el precio no se queda quieto, el cálculo es a precios de hoy y existen tipos reducidos y otras financiaciones."

que_cubre:
  - "Por qué la entrada de un piso de 200.000 € no son 40.000 €: el ITP general del 10 % añade 20.000 €."
  - "Cómo 150 € al mes se convierten en 400 meses, 33 años y 4 meses, y en llegar a los 63."
  - "Los matices: precio congelado, tipos reducidos y financiaciones distintas."

que_no_cubre:
  - "No es asesoramiento financiero ni una predicción: el cálculo es a precios de hoy y con un ejemplo redondo."
  - "No entra en ayudas concretas, avales ni requisitos personales."

para_quien: "Para quien empieza a ahorrar para su primer piso y quiere ver la cuenta completa sin promesas."

