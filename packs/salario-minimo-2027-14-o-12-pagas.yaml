titulo: "Salario mínimo 2027: 1.286 € o 1.500 €, mismo bruto"
slug: salario-minimo-2027-14-o-12-pagas

descripcion_corta: "Cobras lo mismo de dos maneras: 1.286 € en 14 pagas o 1.500,33 € en 12. El bruto anual no cambia: 18.004 €. Lo enseño con la máquina que reparte las pagas."

seo_descripcion: "El salario mínimo de 2027 son 18.004 € brutos al año: 1.286 € en 14 pagas o 1.500,33 € en 12. No es un sueldo mayor, es otro reparto."

resumen_editorial: "El salario mínimo de 2027 sube a 1.286 € en 14 pagas, pero al repartir las dos extras en doce meses sale 1.500,33 € al mes. No son dos sueldos distintos: 14 × 1.286 = 18.004 € y 12 × 1.500,33 = 18.003,96 €, cuatro céntimos de redondeo. Mismo bruto anual, distinto reparto. El prorrateo de las pagas extras exige acuerdo y no lo decide la empresa por su cuenta."

que_cubre:
  - "Por qué 1.286 € en 14 pagas y 1.500,33 € en 12 pagas son el mismo bruto anual de 18.004 €."
  - "De dónde salen los 214,33 € al mes que añaden las dos extras al repartirlas en doce pagas."
  - "Los cuatro céntimos de 12 × 1.500,33: redondeo, no una diferencia de salario."
  - "Que el prorrateo de las extras requiere acuerdo y no es una decisión unilateral."

que_no_cubre:
  - "No calcula nóminas netas ni retenciones: todas las cifras del vídeo son brutas."
  - "No analiza convenios concretos ni qué empresas prorratean: el importe de 2027 es el mínimo legal."

para_quien: "Para quien ha visto 1.286 € y 1.500 € en la misma noticia del salario mínimo y quiere saber cuál cobra de verdad."

