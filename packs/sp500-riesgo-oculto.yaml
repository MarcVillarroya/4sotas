titulo: "S&P 500: el riesgo oculto de creerte diversificado"
slug: sp500-riesgo-oculto

descripcion_corta: "Siete compañías concentran un tercio de tu fondo indexado. Qué significa para 10.000 €, qué pasa si caen y cómo mirarlo en tu propia cartera."

seo_descripcion: "El S&P 500 no reparte tu dinero a partes iguales: siete compañías pesan el 33,89 %. Qué implica para 10.000 € y cómo revisar tu cartera."

resumen_editorial: "El S&P 500 reúne 500 compañías, aunque tenga 503 valores por las clases de acciones. Siete pesan el 33,89 %: en una cartera de 10.000 € son 3.389 €. El vídeo muestra por qué el número de empresas no mide la diversificación, qué pasaría si las siete cayeran un 30 % (−1.016,70 €) y por qué el MSCI World tampoco lo resuelve: 1.248 componentes y el 73 % en EE. UU."

que_cubre:
  - "500 compañías y 503 valores: por qué el número de posiciones no mide la diversificación real."
  - "El reparto de 10.000 €: 3.389 € en las siete mayores y 6.611 € en las 493 restantes."
  - "El escenario de una caída del 30 % en las siete: −1.016,70 €, un −10,17 % de la cartera."
  - "La comparación con el MSCI World: 1.248 componentes, 73 % en EE. UU. y las mismas siete arriba."

que_no_cubre:
  - "No es una predicción ni una recomendación de compra o venta: el escenario de caída es hipotético."
  - "No entra en fiscalidad, costes de los fondos ni en qué índice elegir para cada perfil."

para_quien: "Para quien invierte en un fondo indexado al S&P 500 y cree que por tener 500 empresas su dinero está repartido."

